[project]
name = "transcribe"
version = "0.1.0"
description = "Local WAV/MP3 to text transcription with speaker diarization, tuned for AMD Radeon (ROCm) GPUs"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "torch>=2.14",
    "torchaudio>=2.11",
    "torchcodec>=0.7",
    "triton-rocm",
    "transformers>=4.57",
    "accelerate",
    "pyannote.audio>=4.0",
    "numpy",
    "flask>=3.0",
]

[project.scripts]
transcribe = "transcribe.cli:main"
transcribe-web = "transcribe.web:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["transcribe"]

[tool.setuptools.package-data]
transcribe = ["static/*"]

[tool.uv]
# ROCm wheels only exist for Linux x86_64.
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]

# ROCm builds of torch/torchaudio come from PyTorch's own index. torchcodec is
# taken from the CPU index: the PyPI wheel links against CUDA's libnvrtc and
# fails to load on a ROCm system (we decode audio with ffmpeg anyway; it is
# only here to satisfy pyannote/transformers imports).
[tool.uv.sources]
torch = { index = "pytorch-rocm" }
torchaudio = { index = "pytorch-rocm" }
triton-rocm = { index = "pytorch-rocm" }
torchcodec = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-rocm"
url = "https://download.pytorch.org/whl/rocm7.2"
explicit = true

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
